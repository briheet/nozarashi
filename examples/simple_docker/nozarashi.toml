[project]
name = "simple-docker"
version = "0.1.0"
description = "Dockerfile backend with PostgreSQL and Redis"
profile = "dev"

[inputs.nixpkgs]
type = "flake"
source = "github:NixOS/nixpkgs/nixos-unstable"

[services.postgres]
type = "oci"
reference = "docker.io/library/postgres:17-alpine"
networks = ["default"]
replicas = 1
policy = "unless-stopped"

[services.postgres.environment]
POSTGRES_DB = "nozarashi"
POSTGRES_USER = "nozarashi"
POSTGRES_PASSWORD = "nozarashi"
PGDATA = "/var/lib/postgresql/data/pgdata"

[[services.postgres.volumes]]
name = "postgres-data"
path = "/var/lib/postgresql/data"

[services.redis]
type = "oci"
reference = "docker.io/library/redis:7-alpine"
command = ["redis-server", "--appendonly", "yes"]
networks = ["default"]
replicas = 1
policy = "unless-stopped"

[[services.redis.volumes]]
name = "redis-data"
path = "/data"

[services.backend]
type = "path"
reference = "./backend"
networks = ["default"]
depends_on = ["postgres", "redis"]
replicas = 1
policy = "on-failure"

[services.backend.environment]
PORT = "8080"
CORS_ALLOWED_ORIGIN = "http://localhost:3000"
READ_HEADER_TIMEOUT = "5"
READ_TIMEOUT = "15"
WRITE_TIMEOUT = "15"
IDLE_TIMEOUT = "60"
DATABASEURL = "postgres://nozarashi:nozarashi@simple-docker-postgres-1.simple-docker:5432/nozarashi?sslmode=disable"
DB_MAX_CONNS = "10"
DB_MIN_CONNS = "1"
DB_MAX_CONN_LIFETIME = "30m"
DB_MAX_CONN_IDLE_TIME = "5m"
REDIS_ADDRESS = "simple-docker-redis-1.simple-docker:6379"
REDIS_PASSWORD = ""
REDIS_DATABASE = "0"

[[services.backend.ports]]
host = 18080
container = 8080

[volumes.postgres-data]
driver = "local"

[volumes.redis-data]
driver = "local"

[networks.default]
driver = "default"
